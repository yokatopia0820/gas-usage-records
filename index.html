<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <title>ガス使用量管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: linear-gradient(to bottom, #eff6ff, #fff); min-height: 100vh; color: #1f2937; padding-bottom: 40px; }
    .header { position: sticky; top: 0; z-index: 10; background: #2563eb; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,.1); }
    .header-inner { max-width: 480px; margin: 0 auto; padding: 16px; }.header h1 { font-size: 24px; }.header p { font-size: 13px; color: #bfdbfe; margin-top: 4px; }
    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; margin-bottom: 24px; border: 2px solid #bfdbfe; }.card h2 { font-size: 18px; margin-bottom: 16px; }
    label.field-label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; }.field-group { margin-bottom: 24px; }
    input.text-input, .weight-edit { width: 100%; padding: 12px 16px; font-size: 18px; border: 2px solid #d1d5db; border-radius: 8px; background: #f9fafb; -webkit-appearance: none; appearance: none; } input.text-input:focus, .weight-edit:focus { outline: none; border-color: #3b82f6; }.date-input { text-align: center; }.weight-edit { min-height: 48px; margin-bottom: 12px; text-align: center; background: #fff; }
    .weight-box { padding: 16px; border-radius: 8px; margin-bottom: 24px; }.weight-box.before { background: #eff6ff; border: 2px solid #93c5fd; }.weight-box.after { background: #fff7ed; border: 2px solid #fdba74; }
    .weight-display { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: center; min-height: 56px; display: flex; align-items: center; justify-content: center; }.weight-value { font-size: 30px; font-weight: bold; }.weight-value.before { color: #2563eb; }.weight-value.after { color: #ea580c; }.weight-placeholder { color: #6b7280; }
    .btn-row { display: flex; gap: 8px; }.btn { flex: 1; min-height: 48px; padding: 12px; font-size: 15px; font-weight: 600; color: #fff; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }.btn:active, .btn-save:active { transform: scale(.98); }.btn-camera { background: #3b82f6; }.btn-library { background: #22c55e; }.btn-save { width: 100%; min-height: 56px; padding: 16px; font-size: 18px; font-weight: bold; color: #fff; background: linear-gradient(to right, #22c55e, #16a34a); border: 0; border-radius: 8px; cursor: pointer; }.btn-save:disabled { background: #9ca3af; } input[type=file] { display: none; }
    .lcd-preview { margin-top: 14px; border: 2px solid #86efac; border-radius: 8px; background: #f0fdf4; padding: 10px; }.lcd-preview figcaption { font-size: 13px; font-weight: 700; color: #166534; margin-bottom: 8px; }.lcd-preview img { display: block; width: 100%; max-height: 150px; object-fit: contain; border-radius: 4px; background: #111827; }
    .crop-editor { margin-top: 14px; border: 2px solid #60a5fa; border-radius: 12px; background: #eff6ff; padding: 10px; }.crop-editor h3 { font-size: 14px; margin-bottom: 5px; }.crop-editor p { font-size: 12px; color: #475569; margin-bottom: 10px; line-height: 1.45; }.crop-stage { position: relative; width: 100%; touch-action: none; user-select: none; background: #0f172a; overflow: hidden; border-radius: 7px; }.crop-stage img { width: 100%; display: block; max-height: 360px; object-fit: contain; pointer-events: none; }.crop-frame { position: absolute; border: 3px solid #facc15; background: rgba(250,204,21,.10); box-shadow: 0 0 0 200vmax rgba(15,23,42,.38); touch-action: none; cursor: move; }.crop-handle { position: absolute; width: 28px; height: 28px; right: -15px; bottom: -15px; border-radius: 50%; background: #facc15; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }.btn-read { width: 100%; margin-top: 12px; min-height: 48px; border: 0; border-radius: 8px; color: #fff; background: #2563eb; font-weight: 700; font-size: 16px; }.confidence-note { margin-top: 8px; font-size: 12px; color: #92400e; background: #fef3c7; padding: 8px; border-radius: 6px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; z-index: 50; }.overlay-inner { text-align: center; }.overlay-icon { font-size: 56px; margin-bottom: 16px; }.overlay-text { font-size: 18px; font-weight: 600; }.spin { animation: pulse 1s infinite; } @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .record { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 16px; border-radius: 6px; margin-bottom: 12px; }.record-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }.record-num { font-weight: 600; }.record-date, .lbl { color: #6b7280; }.record-date { font-size: 12px; }.record-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 14px; }.record-grid .val { font-size: 18px; font-weight: bold; }.val.before { color: #2563eb; }.val.after { color: #ea580c; }.record-usage { margin-top: 8px; font-size: 12px; background: #fff; padding: 8px; border-radius: 4px; }.del-btn { background: none; border: 0; color: #dc2626; cursor: pointer; font-size: 14px; padding: 4px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script src="bomata-ocr.js?v=1"></script>
  <script src="ocr-helpers.js?v=adaptive1"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const STORAGE_KEY = 'gasMeterRecords';
    const MAX_IMAGE_BYTES = 10 * 1024 * 1024;

    function App() {
      const today = () => new Date().toISOString().split('T')[0];
      const [formData, setFormData] = useState({ date: today(), receiptNumber: '', beforeWeight: '', afterWeight: '' });
      const [savedRecords, setSavedRecords] = useState([]);
      const [showOverlay, setShowOverlay] = useState(false);
      const [ocrProcessing, setOcrProcessing] = useState(false);
      const [lcdPreviews, setLcdPreviews] = useState({ beforeWeight: '', afterWeight: '' });
      const [cropEditors, setCropEditors] = useState({});
      const [confidenceNotes, setConfidenceNotes] = useState({});
      const previewUrlsRef = useRef({});
      const dragRef = useRef(null);

      useEffect(() => { try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) setSavedRecords(JSON.parse(saved)); } catch { localStorage.removeItem(STORAGE_KEY); } }, []);
      useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRecords)); }, [savedRecords]);
      useEffect(() => () => Object.values(previewUrlsRef.current).forEach(url => URL.revokeObjectURL(url)), []);
      useEffect(() => { BomataOCR.init().catch(() => alert('OCRエンジンの準備に失敗しました。')); }, []);

      async function openImage(file) {
        if ('createImageBitmap' in window) return createImageBitmap(file);
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file); const image = new Image();
          image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
          image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした。')); };
          image.src = url;
        });
      }

      const clampRect = (rect, width, height) => {
        const minWidth = Math.max(80, width * .12); const minHeight = Math.max(45, height * .06);
        const w = Math.max(minWidth, Math.min(width, rect.w)); const h = Math.max(minHeight, Math.min(height, rect.h));
        return { x: Math.max(0, Math.min(width - w, rect.x)), y: Math.max(0, Math.min(height - h, rect.y)), w, h };
      };

      async function handleFile(event, field) {
        const file = event.target.files[0]; event.target.value = ''; if (!file) return;
        if (!file.type.startsWith('image/')) return alert('画像ファイルを選択してください。');
        if (file.size > MAX_IMAGE_BYTES) return alert('画像は10MB以下にしてください。');
        try {
          const image = await openImage(file); const width = Math.min(1200, image.width); const height = Math.round(image.height * width / image.width);
          const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
          const context = canvas.getContext('2d', { willReadFrequently: true }); context.drawImage(image, 0, 0, width, height);
          const detected = findDisplayBounds(context.getImageData(0, 0, width, height)); image.close?.();
          const rect = clampRect(detected ? { x: detected.x, y: detected.y, w: detected.width, h: detected.height } : { x: width * .18, y: height * .48, w: width * .64, h: height * .20 }, width, height);
          const previous = cropEditors[field]?.url; if (previous) URL.revokeObjectURL(previous);
          setCropEditors(editors => ({ ...editors, [field]: { file, url: URL.createObjectURL(file), width, height, rect } }));
          setConfidenceNotes(notes => ({ ...notes, [field]: '' }));
        } catch (error) { alert('画像を開けませんでした: ' + error.message); }
      }

      function beginCropDrag(event, field, mode) {
        const editor = cropEditors[field]; if (!editor) return;
        event.currentTarget.setPointerCapture(event.pointerId);
        dragRef.current = { field, mode, startX: event.clientX, startY: event.clientY, rect: editor.rect, stage: event.currentTarget.closest('.crop-stage').getBoundingClientRect() };
      }

      function moveCropDrag(event) {
        const drag = dragRef.current; if (!drag) return;
        const editor = cropEditors[drag.field]; if (!editor) return;
        const dx = (event.clientX - drag.startX) * editor.width / drag.stage.width; const dy = (event.clientY - drag.startY) * editor.height / drag.stage.height;
        const next = drag.mode === 'resize' ? { ...drag.rect, w: drag.rect.w + dx, h: drag.rect.h + dy } : { ...drag.rect, x: drag.rect.x + dx, y: drag.rect.y + dy };
        setCropEditors(editors => ({ ...editors, [drag.field]: { ...editor, rect: clampRect(next, editor.width, editor.height) } }));
      }

      function endCropDrag() { dragRef.current = null; }

      async function readSelectedDisplay(field) {
        const editor = cropEditors[field]; if (!editor) return;
        setOcrProcessing(true); setShowOverlay(true);
        try {
          await BomataOCR.init(); const image = await openImage(editor.file);
          const canvas = document.createElement('canvas'); canvas.width = editor.width; canvas.height = editor.height;
          const context = canvas.getContext('2d', { willReadFrequently: true }); context.drawImage(image, 0, 0, editor.width, editor.height); image.close?.();
          const rect = editor.rect; const imageData = context.getImageData(Math.round(rect.x), Math.round(rect.y), Math.round(rect.w), Math.round(rect.h));
          const result = BomataOCR.read(imageData.data, imageData.width, imageData.height);
          if (!result) throw new Error('枠を緑LCDの内側へ合わせて、もう一度読み取ってください。');
          const preview = document.createElement('canvas'); preview.width = imageData.width; preview.height = imageData.height; preview.getContext('2d').putImageData(imageData, 0, 0);
          const previousUrl = previewUrlsRef.current[field]; const previewUrl = preview.toDataURL('image/jpeg', .92); previewUrlsRef.current[field] = previewUrl; if (previousUrl?.startsWith('blob:')) URL.revokeObjectURL(previousUrl);
          setLcdPreviews(previous => ({ ...previous, [field]: previewUrl }));
          if (result.conf < BomataOCR.CONFIDENCE_WARN) {
            setConfidenceNotes(notes => ({ ...notes, [field]: `信頼度 ${(result.conf * 100).toFixed(0)}%：信頼度が低いため、数値は入力しません。黄色い枠を緑LCDの数字だけへ合わせて、もう一度読み取ってください。` }));
            return;
          }
          setFormData(previous => ({ ...previous, [field]: result.value.toFixed(3) }));
          setConfidenceNotes(notes => ({ ...notes, [field]: '' }));
          setCropEditors(editors => ({ ...editors, [field]: null }));
        } catch (error) { alert('読み取りエラー: ' + error.message); }
        setOcrProcessing(false); setShowOverlay(false);
      }

      function handleSave() {
        if (formData.date && formData.receiptNumber && formData.beforeWeight && formData.afterWeight) {
          setSavedRecords([{ ...formData, id: Date.now() }, ...savedRecords]);
          setFormData({ date: today(), receiptNumber: '', beforeWeight: '', afterWeight: '' });
        } else alert('すべての項目を入力してください');
      }
      function handleDelete(id) { if (confirm('削除しますか？')) setSavedRecords(savedRecords.filter(record => record.id !== id)); }

      return <div>
        <header className="header"><div className="header-inner"><h1>ガス使用量管理</h1><p>現場での片手記録</p></div></header>
        <main className="container"><section className="card"><h2>新規記録</h2>
          <div className="field-group"><label className="field-label" htmlFor="date">日付</label><input id="date" type="date" className="text-input date-input" value={formData.date} onChange={event => setFormData({ ...formData, date: event.target.value })} /></div>
          <div className="field-group"><label className="field-label" htmlFor="receipt">受付番号</label><input id="receipt" type="text" className="text-input" placeholder="例）12345" value={formData.receiptNumber} onChange={event => setFormData({ ...formData, receiptNumber: event.target.value })} /></div>
          {[['beforeWeight', '使用前重量 (kg)', 'before'], ['afterWeight', '使用後重量 (kg)', 'after']].map(([field, label, tone]) => <div className={`weight-box ${tone}`} key={field}>
            <label className="field-label">{label}</label><div className="weight-display">{formData[field] ? <span className={`weight-value ${tone}`}>{formData[field]}</span> : <span className="weight-placeholder">待機中...</span>}</div>
            <input aria-label={`${label}を手入力`} className="weight-edit" type="number" inputMode="decimal" min="0" max="200" step="0.001" placeholder="認識結果を確認・修正" value={formData[field]} onChange={event => setFormData({ ...formData, [field]: event.target.value })} />
            <div className="btn-row"><label className="btn btn-camera">📷 カメラ<input type="file" accept="image/*" capture="environment" onChange={event => handleFile(event, field)} /></label><label className="btn btn-library">📁 ライブラリ<input type="file" accept="image/*" onChange={event => handleFile(event, field)} /></label></div>
            {cropEditors[field] && <section className="crop-editor"><h3>緑LCDを黄色枠で囲ってください</h3><p>枠の中をドラッグすると移動、右下の丸をドラッグすると大きさを調整できます。</p><div className="crop-stage" onPointerMove={moveCropDrag} onPointerUp={endCropDrag} onPointerCancel={endCropDrag}><img src={cropEditors[field].url} alt="計量器の写真。黄色い枠を緑LCDへ合わせる。" /><div className="crop-frame" style={{ left: `${cropEditors[field].rect.x / cropEditors[field].width * 100}%`, top: `${cropEditors[field].rect.y / cropEditors[field].height * 100}%`, width: `${cropEditors[field].rect.w / cropEditors[field].width * 100}%`, height: `${cropEditors[field].rect.h / cropEditors[field].height * 100}%` }} onPointerDown={event => beginCropDrag(event, field, 'move')}><span className="crop-handle" aria-label="枠の大きさを調整" onPointerDown={event => { event.stopPropagation(); beginCropDrag(event, field, 'resize'); }} /></div></div><button className="btn-read" type="button" onClick={() => readSelectedDisplay(field)} disabled={ocrProcessing}>この範囲を読み取る</button></section>}
            {lcdPreviews[field] && <figure className="lcd-preview"><figcaption>読み取り対象（緑LCDのみ）</figcaption><img src={lcdPreviews[field]} alt="切り出した計量器の緑LCD表示部" /></figure>}
            {confidenceNotes[field] && <p className="confidence-note">{confidenceNotes[field]}</p>}
          </div>)}
          <button className="btn-save" onClick={handleSave} disabled={ocrProcessing}>✓ 保存する</button>
        </section>{savedRecords.length > 0 && <section className="card"><h2>記録履歴 ({savedRecords.length})</h2>{savedRecords.map(record => <article className="record" key={record.id}><div className="record-top"><span className="record-num">{record.receiptNumber}</span><span><span className="record-date">{record.date}</span><button className="del-btn" aria-label={`${record.receiptNumber}を削除`} onClick={() => handleDelete(record.id)}>🗑</button></span></div><div className="record-grid"><div><div className="lbl">使用前</div><div className="val before">{record.beforeWeight} kg</div></div><div><div className="lbl">使用後</div><div className="val after">{record.afterWeight} kg</div></div></div><div className="record-usage">使用量: <strong>{(parseFloat(record.beforeWeight) - parseFloat(record.afterWeight)).toFixed(3)}</strong> kg</div></article>)}</section>}</main>
        {showOverlay && <div className="overlay" role="status" aria-live="polite"><div className="overlay-inner">{ocrProcessing ? <><div className="overlay-icon spin">🔄</div><div className="overlay-text" style={{ color: '#fde047' }}>表示部を切り出し中...</div></> : <><div className="overlay-icon">✓</div><div className="overlay-text" style={{ color: '#86efac' }}>完了！</div></>}</div></div>}
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
